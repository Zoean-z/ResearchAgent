[project]
name = "openviking-memory-routed-paper-agent"
version = "0.1.0"
description = "Scaffold for a memory-routed paper agent that prioritizes research memory before rereading source papers."
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.0.0",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-ai>=0.0,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pypdf>=5.0,<6.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
